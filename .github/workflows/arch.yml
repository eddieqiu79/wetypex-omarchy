name: Arch package
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 40
    steps:
      - name: Prepare clean Arch build environment
        run: |
          # The minimal image excludes docs by default; inspect the entire installed package.
          sed -i '/^[[:space:]]*NoExtract[[:space:]]*=/d' /etc/pacman.conf
          pacman -Syu --noconfirm git cmake clang boost fcitx5 fcitx5-qt libime libc++ json-c curl openssl bubblewrap util-linux python python-cryptography python-gobject gdk-pixbuf2 libheif libavif python-fonttools python-pillow fontconfig wayland qt6-base qt6-svg qt6-webengine qt6-imageformats wl-clipboard pipewire ffmpeg libnotify polkit
          useradd -m builder
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Export and build as ordinary user
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- python3 tools/build-arch.py --output /tmp/wetypex-build --build
      - name: Build retained baseline for package upgrade and rollback
        run: |
          runuser -u builder -- git worktree add --detach /tmp/wetypex-baseline-source 61686a00fceec3cb650e4a098af42b67d77880d9
          runuser -u builder -- python3 /tmp/wetypex-baseline-source/tools/build-arch.py --output /tmp/wetypex-baseline-build --build
          pacman -U --noconfirm /tmp/wetypex-baseline-build/wetypex-omarchy-*.pkg.tar.zst
          install -d -m 700 /home/builder/.config/fcitx5 /home/builder/.local/share/fcitx5-wetypex/state
          printf '%s\n' '{"synthetic_keep":true}' > /home/builder/.config/fcitx5/wetypex.json
          printf '%s\n' 'synthetic preservation marker; not an identity' > /home/builder/.local/share/fcitx5-wetypex/state/package-test-marker
          sha256sum /home/builder/.config/fcitx5/wetypex.json /home/builder/.local/share/fcitx5-wetypex/state/package-test-marker > /tmp/user-state.sha256
      - name: Verify package and isolated installation
        run: |
          pacman -U --noconfirm /tmp/wetypex-build/wetypex-omarchy-*.pkg.tar.zst
          pacman -Qkk wetypex-omarchy
          sha256sum --check /tmp/user-state.sha256
          /usr/bin/fcitx5-wetypex-update --status
          test -x /usr/bin/wetypex-omarchy-package
          test -f /usr/share/fcitx5-wetypex/compat/cloud/图片格式.py
          test -f /usr/share/licenses/fcitx5-wetypex/WeTypeX-MIT.txt
          test -f /usr/share/fcitx5-wetypex/compat/LICENSE
          test -f /usr/lib/systemd/user/wetypex-sync.service
          test ! -e /usr/compat
          QT_QPA_PLATFORM=offscreen /usr/bin/wetypex-image-helper --normalize-image < fixtures/formats/synthetic.png > /tmp/check.png
          python -c 'from pathlib import Path; assert Path("/tmp/check.png").read_bytes().startswith(b"\x89PNG")'
          pacman -Q > /tmp/wetypex-build/build-packages.txt
          cd /tmp/wetypex-build
          # GitHub artifact filenames cannot contain colons; package metadata is unchanged.
          for pkg in *.pkg.tar.zst; do safe=$(printf "%s" "$pkg" | tr : _); if [ "$pkg" != "$safe" ]; then mv -- "$pkg" "$safe"; fi; done
          sha256sum *.pkg.tar.zst > SHA256SUMS
          # Exercise package-level rollback and re-upgrade using the same dependency set.
          pacman -U --noconfirm /tmp/wetypex-baseline-build/wetypex-omarchy-*.pkg.tar.zst
          pacman -Qkk wetypex-omarchy
          sha256sum --check /tmp/user-state.sha256
          pacman -U --noconfirm /tmp/wetypex-build/wetypex-omarchy-*.pkg.tar.zst
          pacman -Qkk wetypex-omarchy
          sha256sum --check /tmp/user-state.sha256
          pacman -R --noconfirm wetypex-omarchy
          sha256sum --check /tmp/user-state.sha256
          test ! -e /usr/bin/wetypex-image-helper
          test ! -e /usr/lib/systemd/user/wetypex-sync.service
      - name: Upload source manifest and package for review (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.artifact_name || format('wetypex-omarchy-arch-{0}', github.sha) }}
          path: |
            /tmp/wetypex-build/*.pkg.tar.zst
            /tmp/wetypex-build/source-manifest.json
            /tmp/wetypex-build/build-packages.txt
            /tmp/wetypex-build/SHA256SUMS
            /tmp/wetypex-build/PKGBUILD
            /tmp/wetypex-build/wetypex-omarchy.install
            /tmp/wetypex-build/wetypex-omarchy-source.tar.gz
          retention-days: 14
