name: Offline source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Syntax and offline sync regression
        run: |
          python3 -m py_compile tools/preflight.py omarchy/*.py tests/*.py compat/cloud/*.py
          python3 tests/check-wetypex-sync-stability.py
          python3 tools/preflight.py
      - name: Check patch formatting
        run: git diff --check
